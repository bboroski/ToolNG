<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="540" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">ToolzNG — duck-powered Apple care</title>
  <desc id="desc">Dark gold banner with the ToolzNG duck engineer mascot and a native Windows device diagnostics panel.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050505"/><stop offset="1" stop-color="#0D1115"/></linearGradient>
    <linearGradient id="gold" x2="1" y2="1"><stop stop-color="#FCEE0A"/><stop offset=".56" stop-color="#FCEE0A"/><stop offset="1" stop-color="#A69B00"/></linearGradient>
    <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#11171C"/><stop offset="1" stop-color="#11171C"/></linearGradient>
  </defs>
  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="210" cy="186" r="180" fill="#FCEE0A" opacity=".055"/>
  <path d="M0 312Q330 250 590 360H0z" fill="#FCEE0A" opacity=".06"/>
  <g transform="translate(42 26) scale(.68)" stroke="#A69B00" stroke-width="7" stroke-linejoin="round">
    <ellipse cx="205" cy="289" rx="134" ry="91" fill="url(#gold)"/>
    <ellipse cx="194" cy="307" rx="78" ry="46" fill="#A69B00" opacity=".6" stroke="none"/>
    <ellipse cx="205" cy="153" rx="104" ry="101" fill="url(#gold)"/>
    <path d="M127 115c23-44 85-62 129-24" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
    <g fill="#0D1115" stroke="#050505" stroke-width="7">
      <path d="M135 133q3-13 17-13h43q14 0 15 14l-4 25q-2 12-15 12h-38q-13 0-15-13z"/>
      <path d="M216 134q2-14 16-14h42q14 0 15 14l-4 24q-2 13-15 13h-38q-14 0-15-13z"/>
      <path d="M208 138q7-7 14 0" fill="none" stroke-width="8"/>
    </g>
    <path d="M269 174q34-13 66 8-18 31-64 23-18-8-2-31z" fill="#A69B00" stroke="#A69B00"/>
    <path d="M169 42l-8-26 28 16 19-26 17 26 29-15-10 29z" fill="#FCEE0A" stroke="#A69B00" stroke-width="5"/>
    <path d="M154 366q-25 17-48 13 12-24 41-24M249 366q-14 18-39 17 6-23 29-28" fill="#A69B00" stroke="#A69B00" stroke-width="6"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="430" y="130" fill="#FFFFFF" font-size="66" font-weight="800">Toolz<tspan fill="#FCEE0A">NG</tspan></text>
    <text x="435" y="177" fill="#FCEE0A" font-size="20" font-weight="700" letter-spacing="2">NATIVE APPLE DEVICE DIAGNOSTICS</text>
    <text x="435" y="222" fill="#FFFFFF" font-size="20">USB-проверки и аудит backup-маркеров</text>
    <text x="435" y="252" fill="#FFFFFF" font-size="20">Приватные отчёты. Всё локально.</text>
    <rect x="435" y="282" width="258" height="42" rx="21" fill="#FCEE0A"/>
    <text x="564" y="310" text-anchor="middle" fill="#050505" font-size="17" font-weight="800">C17 · WIN32 · WINDOWS x64</text>
  </g>
  <g transform="translate(825 48)">
    <rect x="0" y="0" width="408" height="266" rx="18" fill="url(#panel)" stroke="#29343B" stroke-width="2"/>
    <rect x="0" y="0" width="408" height="48" rx="18" fill="#0D1115"/>
    <path d="M0 32h408v16H0z" fill="#0D1115"/>
    <circle cx="25" cy="24" r="6" fill="#FCEE0A"/><text x="44" y="30" fill="#FFFFFF" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">ToolzNG · Центр управления</text>
    <rect x="24" y="72" width="360" height="72" rx="12" fill="#0D1115" stroke="#29343B"/>
    <circle cx="53" cy="108" r="12" fill="#FCEE0A"/><path d="M47 108l5 5 9-11" fill="none" stroke="#0D1115" stroke-width="3" stroke-linecap="round"/>
    <text x="78" y="101" fill="#FFFFFF" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Готов к USB-проверке</text>
    <text x="78" y="125" fill="#A6B2BC" font-family="Segoe UI,Arial,sans-serif" font-size="13">Подключи iPhone или iPad</text>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle">
      <rect x="24" y="162" width="108" height="62" rx="11" fill="#11171C" stroke="#29343B"/><text x="78" y="188" fill="#FCEE0A">01</text><text x="78" y="208" fill="#FFFFFF">USB</text>
      <rect x="150" y="162" width="108" height="62" rx="11" fill="#11171C" stroke="#29343B"/><text x="204" y="188" fill="#FCEE0A">02</text><text x="204" y="208" fill="#FFFFFF">Backup</text>
      <rect x="276" y="162" width="108" height="62" rx="11" fill="#11171C" stroke="#29343B"/><text x="330" y="188" fill="#FCEE0A">03</text><text x="330" y="208" fill="#FFFFFF">Отчёт</text>
    </g>
    <text x="204" y="248" text-anchor="middle" fill="#A6B2BC" font-family="Segoe UI,Arial,sans-serif" font-size="12">Проверяй. Понимай. Действуй безопасно.</text>
  </g>
</svg>
