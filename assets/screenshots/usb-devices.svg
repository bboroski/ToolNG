<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc"><title id="title">ToolzNG — USB-устройства Apple — UI preview</title><desc id="desc">Static preview of the documented Win32 layout. Values are illustrative sample data, not a live device scan.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D0D0D"/><stop offset="1" stop-color="#171717"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#BFA100"/><stop offset="1" stop-color="#FFD600"/></linearGradient></defs>
