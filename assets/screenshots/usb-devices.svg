t x="30" y="411" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#999999" text-anchor="start">История и предпросмотр</text><rect x="16" y="428" width="192" height="48" rx="9" fill="#141414" stroke="#141414"/><text x="30" y="449" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#B8B8B8" text-anchor="start">Справка</text><text x="30" y="467" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#999999" text-anchor="start">Руководство офлайн</text><text x="24" y="758" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#777777" text-anchor="start">TOOLZNG  /  C17</text>
 <text x="252" y="140" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#F0F0F0" text-anchor="start">USB-устройства Apple</text><text x="254" y="168" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">Поиск устройств с USB Vendor ID 05AC. Список отражает то, что обнаруживает Windows.</text><rect x="250" y="188" width="842" height="66" rx="12" fill="#1A1A1A" stroke="#303030"/><text x="270" y="229" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#E6E6E6" text-anchor="start">Служба Apple Mobile Device Service запущена.</text><rect x="914" y="119" width="178" height="40" rx="8" fill="url(#gold)" stroke="none"/><text x="1003" y="144" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">Повторить поиск</text><rect x="250" y="274" width="842" height="78" rx="12" fill="#1A1A1A" stroke="#303030"/><text x="270" y="306" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" fill="#F0F0F0" text-anchor="start">Apple Mobile Device USB Composite Device</text><text x="270" y="333" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">Производитель: Apple · Hardware ID match: VID_05AC</text><rect x="250" y="370" width="842" height="78" rx="12" fill="#1A1A1A" stroke="#303030"/><text x="270" y="402" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#FFD600" text-anchor="start">Состояние обнаружения</text><text x="270" y="428" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#B8B8B8" text-anchor="start">1 видимый PnP-интерфейс · 0 отключений за последние 10 минут</text><rect x="250" y="474" width="842" height="104" rx="12" fill="#171717" stroke="#303030"/><text x="270" y="507" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#FFD600" text-anchor="start">ВАЖНО</text><text x="270" y="535" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#E6E6E6" text-anchor="start">VID_05AC означает, что Windows видит USB-интерфейс Apple.</text><text x="270" y="558" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">Это не тест пропускной способности и не закрытый канал диагностики iOS.</text><text x="252" y="692" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#999999" text-anchor="start">USB Pulse: события arrival/removal · локальная история ограничена ротацией</text><rect x="887" y="748" width="205" height="24" rx="12" fill="#232323" stroke="#4A3E00"/><text x="989" y="765" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#FFD600" text-anchor="middle">UI PREVIEW  ·  SAMPLE DATA</text></svg>