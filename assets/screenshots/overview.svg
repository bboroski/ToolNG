anchor="start">01 / USB-ДИАГНОСТИКА</text><text x="268" y="487" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#F0F0F0" text-anchor="start">Список устройств</text><text x="268" y="516" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">USB Vendor ID 05AC и</text><text x="268" y="536" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">состояние службы Apple.</text><text x="554" y="450" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#FFD600" text-anchor="start">02 / РЕЗЕРВНЫЕ КОПИИ</text><text x="554" y="487" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#F0F0F0" text-anchor="start">Backup Sentinel</text><text x="554" y="516" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">3 из 3 каталогов содержат</text><text x="554" y="536" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">ожидаемые маркеры.</text><text x="840" y="450" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#FFD600" text-anchor="start">03 / SAFE CARE</text><text x="840" y="487" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#F0F0F0" text-anchor="start">Безопасная проверка</text><text x="840" y="516" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">Подсказки по настройкам</text><text x="840" y="536" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">и обслуживанию iOS.</text><text x="252" y="625" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#999999" text-anchor="start">Готово. Windows-side сканирование завершено.</text><text x="252" y="648" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#FFD600" text-anchor="start">Backup Sentinel: 3/3 маркеры на месте · свежесть: 12 дн.</text><text x="252" y="671" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#999999" text-anchor="start">USB Pulse · 10 мин: подключений 0 / отключений 0 · наблюдение активно</text><rect x="887" y="748" width="205" height="24" rx="12" fill="#232323" stroke="#4A3E00"/><text x="989" y="765" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#FFD600" text-anchor="middle">UI PREVIEW  ·  SAMPLE DATA</text></svg>