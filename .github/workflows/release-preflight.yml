name: Release preflight

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate signed SemVer release tag
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history and tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version, signature, main ancestry, license, and changelog
        run: python3 .github/scripts/release_guard.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
