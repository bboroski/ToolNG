name: Engineering Standard
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engineering-standard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  profile-validation:
    name: profile-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate repository Engineering Standard
        run: python .engineering/validate.py
