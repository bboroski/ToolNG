name: Engineering Integrity Reference
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic self-tests
        run: python tools/engineering_integrity.py --self-test
      - name: Audit repository source tree
        run: python tools/engineering_integrity.py --root . --format text
