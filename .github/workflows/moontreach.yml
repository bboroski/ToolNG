name: MoonTreach

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_all:
        description: Run every configured project suite
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: moontreach-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan and validate
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate MoonTreach and its unit tests
        uses: bboroski/SAMBU/.github/actions/moontreach@fdd7b093d0e054cbe36c9552632a355666568a01
        with:
          mode: validate
      - name: Select affected suites
        id: plan
        uses: bboroski/SAMBU/.github/actions/moontreach@fdd7b093d0e054cbe36c9552632a355666568a01
        with:
          mode: plan
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.sha }}
          force_all: ${{ inputs.force_all || false }}

  tests:
    name: ${{ matrix.id }}
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.matrix != '{"include":[]}'
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
      - name: Run selected suite
        uses: bboroski/SAMBU/.github/actions/moontreach@fdd7b093d0e054cbe36c9552632a355666568a01
        with:
          mode: run
          suite: ${{ matrix.id }}

  report:
    name: Pipeline report
    if: always()
    needs: [plan, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Publish run summary
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          {
            echo '## MoonTreach pipeline'
            echo
            echo "- Planner: **${PLAN_RESULT}**"
            echo "- Affected test suites: **${TEST_RESULT}**"
            echo '- No checks are bypassed and no PR is merged automatically.'
          } >> "$GITHUB_STEP_SUMMARY"
