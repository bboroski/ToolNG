name: Jun-Jun Repository Guard

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jun-jun-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Safe repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Inspect tracked source safely
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, sys
          try:
              paths = subprocess.check_output(
                  ["git", "ls-files", "-z"], text=False
              ).decode("utf-8", "replace").split("\0")
          except subprocess.CalledProcessError:
              print("Jun-Jun: cannot enumerate tracked files")
              sys.exit(2)
          source_ext = {
              ".py", ".c", ".h", ".cc", ".cpp", ".hpp", ".rs", ".go",
              ".js", ".jsx", ".ts", ".tsx", ".java", ".cs", ".sh",
              ".ps1", ".yml", ".yaml", ".toml", ".json", ".xml", ".html"
          }
          secret_patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bgh[pousr]_[A-Za-z0-9]{30,}\b"),
              re.compile(r"\bgithub_pat_[A-Za-z0-9_]{30,}\b"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
          ]
          problems = []
          inspected = 0
          for raw in paths:
              if not raw:
                  continue
              p = pathlib.PurePosixPath(raw)
              if ".git" in p.parts or p.suffix.lower() not in source_ext:
                  continue
              try:
                  data = pathlib.Path(raw).read_bytes()
              except OSError:
                  problems.append((raw, "unreadable tracked source"))
                  continue
              if len(data) > 2_000_000 or b"\0" in data[:8192]:
                  continue
              inspected += 1
              content = data.decode("utf-8", "replace")
              for number, line in enumerate(content.splitlines(), 1):
                  if re.match(r"^<<<<<<< ", line) or re.match(r"^>>>>>>> ", line):
                      problems.append((raw, f"possible merge-conflict marker at line {number}"))
                  if any(pattern.search(line) for pattern in secret_patterns):
                      problems.append((raw, f"possible credential material at line {number}"))
          if problems:
              for path, reason in problems:
                  print(f"Jun-Jun: {path}: {reason}")
              print(f"Jun-Jun: failed; inspected {inspected} tracked source files.")
              sys.exit(1)
          print(f"Jun-Jun: passed; inspected {inspected} tracked source files.")
          print("Jun-Jun: hygiene checks only; project builds, tests and hardware qualification are not implied.")
          PY
