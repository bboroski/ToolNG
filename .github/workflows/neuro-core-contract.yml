name: NEURO-CORE contract
on:
  pull_request:
    paths:
      - 'neuro-core/**'
      - 'tools/validate_neuro_core.py'
      - '.github/workflows/neuro-core-contract.yml'
  push:
    branches: [main]
    paths:
      - 'neuro-core/**'
      - 'tools/validate_neuro_core.py'
      - '.github/workflows/neuro-core-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate 9 x 74 capability register
        run: python3 tools/validate_neuro_core.py
