name: Build ToolzNG (Windows x64)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build Release executable
        run: cmake --build build --config Release --parallel

      - name: Upload ToolzNG.exe
        uses: actions/upload-artifact@v4
        with:
          name: ToolzNG-windows-x64
          path: build/Release/ToolzNG.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach executable to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Release/ToolzNG.exe
