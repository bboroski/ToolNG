name: Build ToolzNG (Windows x64)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolzng-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile ToolzNG
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Configure CMake
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build Release executable and tests
        run: cmake --build build --config Release --parallel
      - name: Run SAMBU engine tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload ToolzNG.exe
        uses: actions/upload-artifact@v4
        with:
          name: ToolzNG-windows-x64
          path: build/Release/ToolzNG.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged executable
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: ToolzNG-windows-x64
          path: dist
      - name: Attach executable to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ToolzNG.exe
